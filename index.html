<!doctype html>
<html lang="pt-BR"><head>
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem('alex-theme'); } catch {}
        // Tema claro por padrão; o escuro só quando escolhido no menu.
        document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
      })();
    </script><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#153f35"/><link rel="icon" type="image/svg+xml" href="/favicon.svg"/><title>Alex • Finanças pessoais</title></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
